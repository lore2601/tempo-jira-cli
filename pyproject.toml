[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tempo-jira-cli"
dynamic = ["version"]
description = "An agent-friendly command-line interface for Tempo Timesheets on Jira Cloud (unofficial)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lorenzo Magnanelli" }]
keywords = ["tempo", "jira", "timesheets", "worklog", "cli", "agents", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = ["click>=8.1", "requests>=2.31"]

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.scripts]
tempo = "tempo_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/lore2601/tempo-jira-cli"
Documentation = "https://github.com/lore2601/tempo-jira-cli#readme"
Issues = "https://github.com/lore2601/tempo-jira-cli/issues"
Changelog = "https://github.com/lore2601/tempo-jira-cli/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests>=2.31",
]

[tool.hatch.version]
path = "src/tempo_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "skills", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF", "C4", "PT", "RET"]
ignore = ["S101", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["tempo_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
